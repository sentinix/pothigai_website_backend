# Render Blueprint for the Pothigai Naturals API.
# Create it from the Render dashboard: New → Blueprint → select this repository.
# Values marked `sync: false` are entered in the dashboard when the Blueprint is
# first applied; they are never stored in this file.
services:
  - type: web
    name: pothigai-api
    runtime: node
    # Singapore is the closest Render region to Tamil Nadu.
    region: singapore
    # A paid instance is required for the persistent disk that stores uploads.
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    # Runs before each deploy goes live. The seed is idempotent: it only adds
    # missing categories/pages/drafts and never overwrites admin edits.
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    # Deploy only after the GitHub Actions CI checks pass on main.
    autoDeployTrigger: checksPass
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pothigai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Requests reach the API through Vercel (which sets the visitor's IP) and
      # then Render's load balancer, so the client IP is two proxy hops back.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # e.g. https://www.pothigainaturals.com (no trailing slash)
      - key: SITE_URL
        sync: false
      # This service's public URL, e.g. https://pothigai-api.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      # Same as SITE_URL (comma-separate several origins if needed)
      - key: CORS_ORIGINS
        sync: false
      # First admin account, created by the seed if it does not exist yet.
      # Remove these two values after the first successful deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: pothigai-db
    databaseName: pothigai
    user: pothigai
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Only Render services can connect; add your IP here for direct access.
    ipAllowList: []
